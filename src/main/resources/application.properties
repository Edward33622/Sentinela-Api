spring.application.name=ApiSentinela
server.port=${PORT:8080}

# Valores locales (contraseña de MySQL, etc.). El archivo local.properties no se sube a Git.
spring.config.import=optional:file:./local.properties

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sentinela_bd}?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0

twilio.accountSid=${TWILIO_ACCOUNT_SID:dummy_sid}
twilio.authToken=${TWILIO_AUTH_TOKEN:dummy_token}
twilio.phoneNumber=${TWILIO_PHONE_NUMBER:whatsapp:+14155238886}

gemini.api.key=${GEMINI_API_KEY:tu_gemini_api_key_aqui}
